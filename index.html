<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Splashboard</title>
    <script>
      // Apply the saved theme before first paint (see src/app/theme/). Mirrors
      // THEME_STORAGE_KEY and resolveTheme() there.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('splashboard:theme') || 'system';
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
